name: Release
# A tag v* runs the tests, builds the package and publishes the GitHub release with its notes from .github/release-notes/<tag>.md.
# Editing a notes file on main updates the matching release, so notes stay in the repository and under review.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/release-notes/**"]
permissions:
  contents: read
jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/check_version.py ${{ github.ref_name }}
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - name: Checksums of everything the release ships
        run: sha256sum dist/* install.ps1 install.sh > SHA256SUMS
      - name: GitHub release with the wheel, the sdist, the installers and their checksums
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: readscout ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/*
            install.ps1
            install.sh
            SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: vars.PUBLISH_PYPI == 'true'
        with:
          name: dist
          path: dist/
  pypi:
    # Publishing to PyPI needs a "trusted publisher" configured once on pypi.org for this repository.
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
  notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update the notes of every existing release that has a notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in .github/release-notes/v*.md; do
            tag="$(basename "$f" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "readscout $tag" --notes-file "$f"
              echo "updated $tag"
            fi
          done
