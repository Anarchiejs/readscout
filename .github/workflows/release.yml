name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - name: GitHub release with the wheel, the sdist and the installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            install.ps1
            install.sh
          generate_release_notes: true
      # Publishing to PyPI needs a "trusted publisher" configured once on pypi.org for this repository.
      - name: Publish to PyPI
        if: vars.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
