name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q --cov=readscout --cov-report=term --cov-fail-under=72
      - run: readscout --version
      - run: python scripts/check_version.py
      - name: No em dash anywhere
        shell: bash
        run: "! grep -rIn $'\u2014' --exclude-dir=.git ."
  installer-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh -n install.sh
      - run: bash -n scripts/e2e.sh
